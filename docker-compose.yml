services:
  db:
    image: postgres:16-alpine
    # M7: перезапуск после ребута/падения + кап логов (иначе диск съедается).
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kwf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kwf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./KWF-backend
    # M7: см. db выше.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set hostnames}
      DATABASE_URL: postgres://${POSTGRES_USER:-kwf}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kwf}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # H3: раздача /media/ средствами Django (стопгэп до nginx/S3).
      DJANGO_SERVE_MEDIA: "1"
    volumes:
      # H3: uploads переживают пересборку backend (иначе media теряется).
      - media:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python backend/manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Coach-site-main
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set public API url}
    environment:
      # M8: runtime URL API (window.__KWF_API_URL через /env.js).
      # Смена API без пересборки: пусто = fallback на запечённый ARG выше.
      KWF_API_URL: ${KWF_API_URL:-}
    # M7: см. db выше.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  # H3: persistent storage для uploads (News.image и т.п.).
  media:
