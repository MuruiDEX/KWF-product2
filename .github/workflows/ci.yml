name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r KWF-backend/requirements.txt
      - run: python KWF-backend/backend/manage.py check
      - run: python KWF-backend/backend/manage.py makemigrations --check --dry-run
      - run: python KWF-backend/backend/manage.py test tournament accounts api schedule -v 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Coach-site-main/package-lock.json
      - run: npm ci
        working-directory: Coach-site-main
      - run: npm test
        working-directory: Coach-site-main
      - run: npx tsc --noEmit
        working-directory: Coach-site-main
      - run: npm run build
        working-directory: Coach-site-main
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Coach-site-main/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r KWF-backend/requirements.txt
      - run: npm ci
        working-directory: Coach-site-main
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: Coach-site-main
      - run: npm run test:e2e
        working-directory: Coach-site-main
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_PYTHON: python3
